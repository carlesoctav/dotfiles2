# Kanagawa #
set -g mouse on

# tmux sensible at home
set -s escape-time 0
set -g history-limit 50000

set -g display-time 4000

set -g status-interval 5

# Increase status bar length to show full session names
set -g status-left-length 30


# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# Fix end/home for xterm-256color
# bind-key -n Home send Escape "OH"
# bind-key -n End send Escape "OF"

unbind r
bind r source-file ~/.tmux.conf
bind-key -r f run-shell "tmux neww ~/.config/scripts/tmux-sessionizer"
bind-key C-e run-shell "~/.config/scripts/edit-tmux-output"
bind C-s new-window -n dashboard "workmux dashboard"
bind C-w new-window -n worktrees "workmux dashboard --tab worktrees"
bind C-j new-window -n sessions "$HOME/.tmux-tools/tmux-session-switcher"
bind C-f run-shell 'tmux new-window -n files "TMUX_PICKER_PANE_ID=#{pane_id} TMUX_PICKER_PANE_DIR=\"#{pane_current_path}\" ~/.config/scripts/tmux-file-picker"'

# set -g default-terminal "xterm-256color"
# set-option -ga terminal-overrides ",xterm-256color:Tc"

# Extended-keys passthrough (Ctrl+Enter etc.) for Kitty-protocol apps
# (e.g. aven TUI via crossterm) that never negotiate xterm modifyOtherKeys:
# - `always` forces mode 1, so modified keys without a standard
#   representation (Ctrl+Enter) are reported in extended form even when the
#   app inside the pane never asked for them. Plain keys (Enter -> CR) are
#   unaffected. Revert to `on` if a legacy app misbehaves.
# - `csi-u` reports them as CSI-u (C-Enter -> `CSI 13;5u`), which Kitty /
#   crossterm parsers understand. The default `xterm` format
#   (`CSI 27;5;13~`) is not reliably parsed by such apps.
set -as terminal-features ',xterm*:extkeys:RGB'
set -g allow-passthrough on
set -s extended-keys always
set -s extended-keys-format csi-u
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set-option -g set-clipboard on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# No xclip pipe: with set-clipboard on, tmux forwards every buffer copy
# to the system clipboard via OSC 52 (ghostty supports it, works over SSH).
# Default MouseDragEnd1Pane (copy-pipe-and-cancel, no command) is enough.


run '~/.tmux/plugins/tpm/tpm'
